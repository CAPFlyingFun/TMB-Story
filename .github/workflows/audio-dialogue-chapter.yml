name: Render a chapter in v4 dialogue mode (spends credits)

# MANUAL ONLY. The first run for a chapter SPENDS ELEVENLABS CREDITS (about one per
# character; Chapter 1 is about 7,100). Raw requests are kept, so running it again only
# re-times the chapter and costs nothing. Listening test only: the chapter's real clips,
# manifest and approval state are never touched.
on:
  workflow_dispatch:
    inputs:
      chapter:
        description: 'Chapter number'
        required: true
        default: '1'
      narrator_tempo:
        description: 'Narrator speed (1.1 = 10% faster, pitch kept)'
        required: true
        default: '1.1'
      paragraph_pause_ms:
        description: 'Pause between two narration paragraphs, in ms'
        required: true
        default: '1100'

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && python3 -m pip install -q numpy
      - name: Render and re-time
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python3 scripts/dialogue-chapter.py "${{ inputs.chapter }}" --narrator-tempo "${{ inputs.narrator_tempo }}" --paragraph-pause-ms "${{ inputs.paragraph_pause_ms }}"
      - name: Commit the result
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/tests/
          git diff --cached --quiet && { echo "Nothing new."; exit 0; }
          git commit -m "Add v4 dialogue-mode test render of chapter ${{ inputs.chapter }}"
          git pull --rebase -q origin main
          git push
