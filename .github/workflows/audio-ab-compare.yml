name: Build v2 vs v4 comparison

# MANUAL ONLY, and free: it downloads takes that were already generated (ElevenLabs
# history) and stitches them with ffmpeg. It never generates speech.
on:
  workflow_dispatch:
    inputs:
      spec:
        description: 'Comparison spec'
        required: true
        default: 'audio/tests/ab-v4-ch9/spec.json'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Fetch the v4 takes and stitch both sides
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python3 scripts/ab-compare.py "${{ inputs.spec }}"
      - name: Commit the comparison files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/tests/
          git diff --cached --quiet && { echo "Nothing new."; exit 0; }
          git commit -m "Add v2 vs v4 comparison audio ($(dirname "${{ inputs.spec }}"))"
          git pull --rebase -q origin main
          git push
