name: Generate TMB audio

# MANUAL ONLY. This workflow is never triggered by a push, because every run can spend
# ElevenLabs credits. Start it from the Actions tab when you intend to generate.
on:
  workflow_dispatch:
    inputs:
      chapters:
        description: 'Chapters, e.g. 1 or 1-3 or 1,3 (blank = all)'
        required: false
        default: '1-3'
      mode:
        description: 'What to generate'
        required: true
        default: 'missing'
        type: choice
        options:
          - missing          # only clips that are absent or whose inputs changed
          - dry-run          # report what would be generated; makes no request
          - force-chapter    # regenerate every clip in the chosen chapters
      force_speaker:
        description: 'Optional: regenerate one speaker only, e.g. sarah-bennett'
        required: false
        default: ''
      commit:
        description: 'Commit the generated audio back to main'
        required: true
        default: true
        type: boolean

concurrency:
  group: tmb-audio-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run the pipeline tests
        run: python3 scripts/tests/test_audio.py
        # These use mocked responses and never call ElevenLabs.

      - name: Validate speaker attribution
        id: validate
        continue-on-error: true
        run: python3 scripts/audio.py validate --chapters "${{ inputs.chapters }}" --show-review

      - name: Stop if validation is not ready
        if: steps.validate.outcome != 'success'
        run: |
          echo "::error::Validation is not ready. Nothing was generated and no credits were spent."
          echo "Assign any missing voice in story-rules/voice-registry.json, or pin an"
          echo "ambiguous speaker in audio/speaker-overrides.json, then run this again."
          exit 1

      - name: Generate
        env:
          # The only place the secret is used. It is passed to the process environment
          # and is never written to a file, a manifest or a log.
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          set -euo pipefail
          ARGS=(generate --chapters "${{ inputs.chapters }}")
          case "${{ inputs.mode }}" in
            dry-run)       ARGS+=(--dry-run) ;;
            force-chapter) ARGS+=(--force-chapter "${{ inputs.chapters }}") ;;
            *)             ARGS+=(--missing) ;;
          esac
          if [ -n "${{ inputs.force_speaker }}" ]; then
            ARGS+=(--force-speaker "${{ inputs.force_speaker }}")
          fi
          python3 scripts/audio.py "${ARGS[@]}"

      - name: Combine each chapter into one listening file
        if: inputs.mode != 'dry-run'
        # ffmpeg is preinstalled on ubuntu-latest, so the manifest's pauses are
        # honoured here. combine never deletes the individual clips.
        run: python3 scripts/audio.py combine --chapters "${{ inputs.chapters }}"

      - name: Rebuild the game dialogue export
        if: inputs.mode != 'dry-run'
        run: python3 scripts/audio.py export-game --chapters "${{ inputs.chapters }}"

      - name: Check that no secret reached the working tree
        if: inputs.mode != 'dry-run'
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          if [ -n "${ELEVENLABS_API_KEY:-}" ] && grep -rqF "$ELEVENLABS_API_KEY" \
              --exclude-dir=.git . 2>/dev/null; then
            echo "::error::The API key appears in the working tree. Refusing to commit."
            exit 1
          fi
          echo "No secret found in the working tree."

      - name: Commit the generated audio
        if: inputs.commit && inputs.mode != 'dry-run'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/
          if git diff --cached --quiet; then
            echo "Nothing new to commit; every clip was already cached."
          else
            git commit -m "Generate TMB audio (chapters ${{ inputs.chapters }}, ${{ inputs.mode }})"
            git push
          fi
