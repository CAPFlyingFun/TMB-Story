name: Generate TMB audio

# MANUAL ONLY. This workflow is never triggered by a push, because every run can spend
# ElevenLabs credits. Start it from the Actions tab when you intend to generate.
on:
  workflow_dispatch:
    inputs:
      chapters:
        description: 'Chapters, e.g. 1 or 1-3 or 1,3 (blank = all)'
        required: false
        default: '1-3'
      mode:
        description: 'What to generate'
        required: true
        default: 'missing'
        type: choice
        options:
          - missing          # only clips that are absent or whose inputs changed
          - dry-run          # report what would be generated; makes no request
          - force-chapter    # regenerate every clip in the chosen chapters
      force_speaker:
        description: 'Optional: regenerate one speaker only, e.g. sarah-bennett'
        required: false
        default: ''
      generate_sfx:
        description: 'ALSO generate missing sound effects and ambience (costs credits)'
        required: true
        default: false
        type: boolean
      commit:
        description: 'Commit the generated audio back to main'
        required: true
        default: true
        type: boolean

concurrency:
  group: tmb-audio-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run the pipeline tests
        run: python3 scripts/tests/test_audio.py
        # These use mocked responses and never call ElevenLabs.

      - name: Validate speaker attribution
        id: validate
        continue-on-error: true
        run: python3 scripts/audio.py validate --chapters "${{ inputs.chapters }}" --show-review

      - name: Stop if validation is not ready
        if: steps.validate.outcome != 'success'
        run: |
          echo "::error::Validation is not ready. Nothing was generated and no credits were spent."
          echo "Assign any missing voice in story-rules/voice-registry.json, or pin an"
          echo "ambiguous speaker in audio/speaker-overrides.json, then run this again."
          exit 1

      - name: Generate
        # Same reasoning as the sound step below: a partial voice run must still commit
        # the clips it paid for. The report step at the end fails the run.
        id: voice
        continue-on-error: true
        env:
          # The only place the secret is used. It is passed to the process environment
          # and is never written to a file, a manifest or a log.
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          set -euo pipefail
          ARGS=(generate --chapters "${{ inputs.chapters }}")
          case "${{ inputs.mode }}" in
            dry-run)       ARGS+=(--dry-run) ;;
            force-chapter) ARGS+=(--force-chapter "${{ inputs.chapters }}") ;;
            *)             ARGS+=(--missing) ;;
          esac
          if [ -n "${{ inputs.force_speaker }}" ]; then
            ARGS+=(--force-speaker "${{ inputs.force_speaker }}")
          fi
          python3 scripts/audio.py "${ARGS[@]}"

      - name: Validate the sound cue sheets
        if: inputs.mode != 'dry-run'
        # Free. Runs on every audio run so a broken cue sheet is visible even when no
        # sound is being generated, and never blocks the voice track.
        continue-on-error: true
        run: python3 scripts/audio.py sfx --chapters "${{ inputs.chapters }}"

      - name: Generate sound effects and ambience
        # OFF BY DEFAULT and never reachable from a push: this workflow is
        # workflow_dispatch only, and this step additionally needs generate_sfx ticked
        # by hand. Sound generation is a deliberate act, like voice generation.
        #
        # continue-on-error IS THE POINT, not laziness. One asset failing used to abort
        # the job, which skipped the commit and threw away 19 assets that had already
        # been paid for. Paid-for audio must reach the repository even when a sibling
        # fails; the run is still marked failed by the report step at the end, after
        # the commit, so nothing is hidden and nothing is lost.
        id: sfx
        continue-on-error: true
        if: inputs.generate_sfx && inputs.mode != 'dry-run'
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python3 scripts/audio.py generate-sfx --chapters "${{ inputs.chapters }}"

      - name: Install ffmpeg
        if: inputs.mode != 'dry-run'
        # Needed by the normalise step below as well as by combine.
        # NOT preinstalled: the ubuntu-24.04 runner image dropped ffmpeg, which is how
        # the first Chapter 1 export came out exactly the length of its own clips with
        # none of the manifest's 60 seconds of pauses in it.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Build the procedural sounds
        if: inputs.mode != 'dry-run'
        # Arithmetic and ffmpeg, so it costs nothing and can be retuned as often as it
        # takes. It runs before normalising because what it writes then gets measured
        # like anything else, and it REFUSES a recipe whose loop would not close --
        # which is the whole reason these exist: the recorded siren announced its seam
        # every twelve seconds.
        continue-on-error: true
        run: python3 scripts/audio.py build-procedural

      - name: Normalise the generated sound assets
        if: inputs.mode != 'dry-run'
        # FREE, and deliberately not gated on generate_sfx: a level is a property of a
        # file, not of a run that paid for one, so a normalise pass must be reachable
        # without buying anything. It decodes each asset, bakes a gain into the mp3 and
        # keeps the generated file as <asset>.source.mp3, and it never touches a
        # generation fingerprint -- so nothing here can cause a credit to be spent.
        #
        # continue-on-error for the same reason the generate steps have it: this runs
        # AFTER generation, so a failure here must not skip the commit and throw away
        # audio that has already been paid for. The measurement step prints the levels
        # immediately below, which is where a silent failure would show up.
        continue-on-error: true
        run: python3 scripts/audio.py normalize-sfx --all

      - name: Register any hand-supplied sound files
        # Runs AFTER normalising on purpose: a supplied file is fingerprinted by its own
        # bytes, and web-encoding changes them. Adopting first would record the
        # fingerprint of a file that no longer exists.
        if: inputs.mode != 'dry-run'
        # Free. A supplied file has no prompt, so its identity is its own bytes; this
        # writes the sidecar that records them, and REFUSES a file with no credit
        # block. Joshua supplies sound from Pixabay and asked to keep track of who
        # made it, so "no attribution, no adoption" is enforced rather than remembered.
        continue-on-error: true
        run: python3 scripts/audio.py adopt-sfx

      - name: Re-derive every cue gain from the measured levels
        if: inputs.mode != 'dry-run'
        # Free, and it has to run AFTER normalising: a gain is computed from the level
        # the asset actually has, so generating or normalising anything makes the old
        # gains stale. Running it here is what stops a rescued asset keeping the
        # rescue gain -- the mistake that made the first normalised build far too loud.
        continue-on-error: true
        run: python3 scripts/audio.py retune-cues --chapters "${{ inputs.chapters }}"

      - name: Refresh the audio credits page
        if: inputs.mode != 'dry-run'
        continue-on-error: true
        run: python3 scripts/audio.py credits

      - name: Combine each chapter into one listening file
        if: inputs.mode != 'dry-run'
        # combine never deletes the individual clips; they stay the master assets.
        run: |
          set -o pipefail
          python3 scripts/audio.py combine --chapters "${{ inputs.chapters }}" | tee combine.log
          if grep -q "without gaps" combine.log; then
            echo "::error::combine fell back to a gapless join, so the export carries none"
            echo "::error::of the manifest's pauses. ffmpeg is missing on this runner."
            exit 1
          fi
          rm -f combine.log

      - name: Measure what is actually in the mix
        if: inputs.mode != 'dry-run'
        # Decodes the exported file and reports real levels. Added because a cue sheet
        # can be perfectly correct and the sound still inaudible: all nine keyboard
        # cues resolved and Joshua could not hear one of them. Free, and never fatal --
        # a measurement that fails must not cost the audio that was just generated.
        continue-on-error: true
        run: python3 scripts/measure-mix.py --chapter "${{ inputs.chapters }}"

      - name: Rebuild the game dialogue export
        if: inputs.mode != 'dry-run'
        # Deliberately NOT scoped to inputs.chapters. The export is the index of every
        # canonical line in the story, and narrowing it to the chapters this run touched
        # deletes the others: a chapter-1 run once cut it from 237 lines to 88. A line
        # whose clip is not generated yet is still a line the game can look up.
        run: python3 scripts/audio.py export-game

      - name: Check that no secret reached the working tree
        if: inputs.mode != 'dry-run'
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          if [ -n "${ELEVENLABS_API_KEY:-}" ] && grep -rqF "$ELEVENLABS_API_KEY" \
              --exclude-dir=.git . 2>/dev/null; then
            echo "::error::The API key appears in the working tree. Refusing to commit."
            exit 1
          fi
          echo "No secret found in the working tree."

      - name: Commit the generated audio
        if: inputs.commit && inputs.mode != 'dry-run'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/
          if git diff --cached --quiet; then
            echo "Nothing new to commit; every clip was already cached."
          else
            git commit -m "Generate TMB audio (chapters ${{ inputs.chapters }}, ${{ inputs.mode }})"
            git push
          fi

      - name: Report any generation failures
        # Runs AFTER the commit on purpose. Everything generated is safely in the
        # repository by now, so failing here loses nothing and hides nothing. A rerun
        # picks up only what is missing, because the cache has the rest.
        if: always() && (steps.voice.outcome == 'failure' || steps.sfx.outcome == 'failure')
        run: |
          echo "::error::Generation did not complete. Everything that succeeded has been"
          echo "::error::committed; re-run this workflow to retry only what is missing."
          echo "voice step: ${{ steps.voice.outcome }}"
          echo "sfx step:   ${{ steps.sfx.outcome }}"
          exit 1
